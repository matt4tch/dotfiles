#~/.tmux.conf
# Plugin declarations are used by TPM on Linux. Home Manager supplies the
# same plugin code directly on macOS.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g status-position top

set -g @dracula-show-powerline true
set -g @dracula-show-left-icon "#S"
set -g @dracula-plugins ""
set -g @dracula-transparent-powerline-bg true
set -g @dracula-show-left-sep 
set -g @dracula-show-right-sep 
set -g @dracula-plugins "time"

set -gq allow-passthrough on

setw -g mode-keys vi

set -g prefix C-b
bind-key C-b send-prefix

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g @t-fzf-prompt '  '

unbind [
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
#     | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
# bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
# bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
# bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
# bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# bind-key -T prefix l send-keys -R C-l \; clear-history
# tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
# if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
# if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
#
# bind-key -T copy-mode-vi 'C-h' select-pane -L
# bind-key -T copy-mode-vi 'C-j' select-pane -D
# bind-key -T copy-mode-vi 'C-k' select-pane -U
# bind-key -T copy-mode-vi 'C-l' select-pane -R
# bind-key -T copy-mode-vi 'C-\' select-pane -l
# bind -r H resize-pane -L 5
# bind -r J resize-pane -D 5
# bind -r K resize-pane -U 5
# bind -r L resize-pane -R 5
# bind N switch-client -l

bind -n C-p previous-window
bind -n C-n next-window

set -g default-terminal "screen-256color"
# Relaunch recorded Codex commands, including `codex resume <session-id>`.
set -g @resurrect-processes 'codex'
# Restoration is run synchronously by the Home Manager launch agent.
# Continuum remains enabled for periodic background saves.
set -g @continuum-restore 'off'
set -g status-interval 5

# Auto-save when a session is destroyed so deleted sessions don't get restored
# set-hook -g session-closed 'run-shell "~/.nix-profile/share/tmux-plugins/resurrect/scripts/save.sh"'
set-hook -g client-detached \
  'run-shell "save_script=\"$HOME/.nix-profile/share/tmux-plugins/resurrect/scripts/save.sh\"; [ -x \"$save_script\" ] || save_script=\"$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh\"; [ ! -x \"$save_script\" ] || \"$save_script\""'
set -s escape-time 0
# set -g status-position top
setw -g monitor-activity on
set -g visual-activity off
setw -g mouse on
set-option -g focus-events on
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
# set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g @t-fzf-prompt '  ' # customize fzf prompt
# set -g renumber-windows on   # renumber all windows when any window is closed
set -g history-limit 1000000 # increase history size (from 2,000)

bind-key T run-shell "sesh connect \"$(sesh list | fzf-tmux -p 55%,60% --no-sort --reverse --ansi --border-label ' sesh ' --prompt '⚡  ' --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)')\""

# set-option -g status-right ""  # Hide right status
set-window-option -g automatic-rename off

# Keep plugin loading at the bottom so all plugin options above are defined.
# The first branch loads Nix packages; the fallback loads the checkouts that
# TPM installs on Linux.
if-shell 'test -r "$HOME/.nix-profile/share/tmux-plugins/sensible/sensible.tmux"' \
  'run-shell "~/.nix-profile/share/tmux-plugins/sensible/sensible.tmux"' \
  'run-shell "~/.tmux/plugins/tmux-sensible/sensible.tmux"'
if-shell 'test -r "$HOME/.nix-profile/share/tmux-plugins/dracula/dracula.tmux"' \
  'run-shell "~/.nix-profile/share/tmux-plugins/dracula/dracula.tmux"' \
  'run-shell "~/.tmux/plugins/tmux/dracula.tmux"'
if-shell 'test -r "$HOME/.nix-profile/share/tmux-plugins/resurrect/resurrect.tmux"' \
  'run-shell "~/.nix-profile/share/tmux-plugins/resurrect/resurrect.tmux"' \
  'run-shell "~/.tmux/plugins/tmux-resurrect/resurrect.tmux"'
if-shell 'test -r "$HOME/.nix-profile/share/tmux-plugins/continuum/continuum.tmux"' \
  'run-shell "~/.nix-profile/share/tmux-plugins/continuum/continuum.tmux"' \
  'run-shell "~/.tmux/plugins/tmux-continuum/continuum.tmux"'
if-shell 'test -r "$HOME/.nix-profile/share/tmux-plugins/tmux-thumbs/tmux-thumbs.tmux"' \
  'run-shell "~/.nix-profile/share/tmux-plugins/tmux-thumbs/tmux-thumbs.tmux"' \
  'run-shell "~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux"'
